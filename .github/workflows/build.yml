name: Build and Release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  build:
    runs-on: windows-2025-vs2026
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Validate release version
        shell: pwsh
        run: |
          $targets = [xml](Get-Content -LiteralPath ".\Directory.Build.targets" -Raw)
          $version = [string]$targets.Project.PropertyGroup.EffekseerForYMM4Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "EffekseerForYMM4Version was not found in Directory.Build.targets."
          }
          if ("${{ github.ref_type }}" -eq "tag") {
            if ("${{ github.ref_name }}" -ne "v$version") {
              throw "Tag/version mismatch. Tag=${{ github.ref_name }} Version=$version"
            }

            git fetch origin main --no-tags
            git merge-base --is-ancestor $env:GITHUB_SHA origin/main
            if ($LASTEXITCODE -ne 0) {
              throw "Release tag must point to a commit merged into main."
            }
          }
          "PACKAGE_VERSION=$version" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Download latest YMM4
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $release = gh release view --repo manju-summoner/YukkuriMovieMaker4 --json tagName,assets | ConvertFrom-Json
          $asset = $release.assets |
            Where-Object { $_.name -match '^YukkuriMovieMaker_v.*\.zip$' -and $_.name -notmatch '_Lite\.zip$' } |
            Select-Object -First 1
          if ($null -eq $asset) {
            throw "Non-Lite YMM4 ZIP asset was not found in release $($release.tagName)."
          }

          New-Item -ItemType Directory -Force -Path ".\YMM4Download" | Out-Null
          gh release download $release.tagName --repo manju-summoner/YukkuriMovieMaker4 --pattern $asset.name --dir ".\YMM4Download" --clobber
          Expand-Archive -LiteralPath ".\YMM4Download\$($asset.name)" -DestinationPath ".\YMM4" -Force

          $exe = Get-ChildItem -LiteralPath ".\YMM4" -Recurse -Filter "YukkuriMovieMaker.exe" -File | Select-Object -First 1
          if ($null -eq $exe) {
            throw "YukkuriMovieMaker.exe was not found after extracting $($asset.name)."
          }

          "YMM4_DIR=$($exe.Directory.FullName)" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          Write-Host "Using YMM4 $($release.tagName) from $($exe.Directory.FullName)."

      - name: Setup Directory.Build.props
        shell: pwsh
        run: |
          $content = @"
          <Project>
            <PropertyGroup>
              <YMM4DirPath>$env:YMM4_DIR\</YMM4DirPath>
            </PropertyGroup>
          </Project>
          "@
          Set-Content -Path "Directory.Build.props" -Value $content

      - name: Restore NuGet packages
        shell: pwsh
        run: dotnet restore .\EffekseerForYMM4\EffekseerForYMM4.csproj

      - name: Build plugin
        shell: pwsh
        run: msbuild .\EffekseerForYMM4\EffekseerForYMM4.csproj /m /p:Configuration=Release /p:Platform=x64

      - name: Create BOOTH package
        shell: pwsh
        run: .\scripts\package-release.ps1 -YMM4DirPath "$env:YMM4_DIR" -Version "$env:PACKAGE_VERSION" -OutputDirectory ".\artifacts"

      - name: Upload BOOTH package
        uses: actions/upload-artifact@v4
        with:
          name: EffekseerForYMM4-booth-package
          path: artifacts/*.zip
          if-no-files-found: error

      - name: Create Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/*.zip
          generate_release_notes: true
